name: Daily Customer Care Bot

on:
  schedule:
    # 01:00 UTC = 08:00 Asia/Ho_Chi_Minh
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug secrets (length only, no values printed)
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "SHEET_ID length: ${#SHEET_ID} (expect 44)"
          echo "TELEGRAM_BOT_TOKEN length: ${#TELEGRAM_BOT_TOKEN} (expect ~46)"
          echo "TELEGRAM_CHAT_ID length: ${#TELEGRAM_CHAT_ID} (expect ~10)"
          echo "GOOGLE_CREDENTIALS_JSON length: ${#GOOGLE_CREDENTIALS_JSON} (expect ~2300+)"
          echo "GOOGLE_CREDENTIALS_JSON first char: ${GOOGLE_CREDENTIALS_JSON:0:1} (expect {)"
          echo "GOOGLE_CREDENTIALS_JSON last char: ${GOOGLE_CREDENTIALS_JSON: -1} (expect })"

      - name: Run bot
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python -m src.main
