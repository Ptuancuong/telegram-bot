name: Daily Customer Care Bot

on:
  schedule:
    # 01:00 UTC = 08:00 Asia/Ho_Chi_Minh
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Kill-switch: đặt repo variable USE_AI=0 để tắt Gemini (dùng template)
          # mà không cần xoá secret hay sửa code. Mặc định 1 (bật AI).
          USE_AI: ${{ vars.USE_AI || '1' }}
        run: python -m src.main
