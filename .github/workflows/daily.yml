name: Daily Customer Care Bot

on:
  schedule:
    # GitHub Actions cron là "best-effort", hay bị hoãn 10' đến vài giờ vào
    # giờ cao điểm — nhất là các mốc TRÒN GIỜ (phút :00). Nên:
    #   1) đặt sớm hơn 8h VN để hấp thụ độ trễ,
    #   2) dùng phút LẺ (tránh mốc đông),
    #   3) đặt NHIỀU mốc dự phòng — bot đã chống gửi trùng (sent_log), nên lần
    #      chạy đầu thành công sẽ gửi, các lần sau tự dedup thành no-op vô hại.
    # Giờ VN = UTC + 7.
    - cron: '23 0 * * *'   # 07:23 VN
    - cron: '43 0 * * *'   # 07:43 VN
    - cron: '7 1 * * *'    # 08:07 VN
    - cron: '37 1 * * *'   # 08:37 VN
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Kill-switch: đặt repo variable USE_AI=0 để tắt Gemini (dùng template)
          # mà không cần xoá secret hay sửa code. Mặc định 1 (bật AI).
          USE_AI: ${{ vars.USE_AI || '1' }}
        run: python -m src.main
